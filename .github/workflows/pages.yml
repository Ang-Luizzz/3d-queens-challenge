name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          spacing_css = '<link rel="stylesheet" href="./spacing-fix.css">'
          view_css = '<link rel="stylesheet" href="./view-layout.css">'
          i18n_js = '<script src="./i18n.js"></script>'
          interaction_js = '<script src="./interaction-fix.js"></script>'
          view_js = '<script src="./view-layout.js"></script>'
          assist_js = '<script src="./assist-layout.js"></script>'
          for marker in (spacing_css, view_css):
              if marker not in s:
                  s = s.replace('</head>', marker + '\n</head>')
          for marker in (i18n_js, interaction_js, view_js, assist_js):
              if marker not in s:
                  s = s.replace('</body>', marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
