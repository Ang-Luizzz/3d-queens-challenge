name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          rsync -a --exclude '_site' --exclude '.git' ./ _site/
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text(encoding='utf-8')
          css_marker = '<link rel="stylesheet" href="./spacing-fix.css">'
          i18n_marker = '<script src="./i18n.js"></script>'
          interaction_marker = '<script src="./interaction-fix.js"></script>'
          if css_marker not in s:
              s = s.replace('</head>', css_marker + '\n</head>')
          if i18n_marker not in s:
              s = s.replace('</body>', i18n_marker + '\n</body>')
          if interaction_marker not in s:
              s = s.replace('</body>', interaction_marker + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
